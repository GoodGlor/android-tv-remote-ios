name: RemoteControl
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  RemoteCore:
    path: RemoteCore
targets:
  RemoteControl:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: RemoteCore
    info:
      path: App/Info.plist
      properties:
        NSLocalNetworkUsageDescription: RemoteControl discovers and controls Android TVs on your Wi-Fi network.
        NSBonjourServices: [_androidtvremote2._tcp, _zeusremote._tcp]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RemoteControl
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Device builds need a signed app. Automatic signing lets Xcode
        # create and renew the certificate and profile itself; with a free
        # (Personal Team) account the profile is valid for 7 days, after
        # which the app stops launching until it is installed again.
        # Drawn by Scripts/make-appicon.py into App/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Your Apple Developer Team ID. Find it at developer.apple.com under
        # Membership, or in Xcode > Settings > Accounts. A free "Personal Team"
        # works: device builds are signed with it, but the profile Apple issues
        # is valid for 7 DAYS, after which the app refuses to launch until it is
        # installed again (its stored data survives).
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
